services:
  postgres:
    image: postgres:16-alpine
    container_name: smartcity-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: smartcity_hub
    ports:
      - "5432:5432"
    volumes:
      - smartcity_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d smartcity_hub"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  smartcity_pgdata:

